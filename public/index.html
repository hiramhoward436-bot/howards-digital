<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Howard's Digital</title>
  <meta name="description" content="Harm's personal dashboard — weather, Kentucky sports, YouTube, projects, and files">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Howard's Digital">
  <link rel="icon" type="image/svg+xml" href="/hd-icon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="topbar-inner">
        <img src="/logo.jpg" alt="Howard's Digital logo" class="logo">
        <h1 id="greeting">Welcome.</h1>
        <p id="today">Your dashboard for the day.</p>
      </div>
      <div class="topbar-actions">
        <span id="status" class="status">Connecting…</span>
        <button type="button" id="edit-toggle" class="big-btn ghost-btn" aria-pressed="false">⇄ Rearrange</button>
        <button type="button" id="settings-btn" class="big-btn ghost-btn" aria-label="Open settings">⚙ Settings</button>
        <button type="button" id="add-section-btn" class="big-btn">＋ Add Section</button>
      </div>
    </header>

    <div id="dashboard" class="dashboard" aria-live="polite">
      <div class="empty">Loading your dashboard…</div>
    </div>

    <div id="hidden-bar" class="hidden-bar" hidden>
      <span class="label">Hidden sections</span>
      <div id="hidden-list" class="hidden-list"></div>
    </div>
  </main>

  <div id="add-modal" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="add-modal-title">
      <div class="modal-head">
        <h2 id="add-modal-title">Add a section</h2>
        <button type="button" id="add-modal-close" aria-label="Close">✕</button>
      </div>
      <p class="muted">Pick what to add to your dashboard. You can rename, reorder, hide, or remove it later.</p>
      <div id="type-picker" class="type-picker"></div>
    </div>
  </div>

  <div id="settings-modal" class="modal-backdrop" hidden>
    <div class="modal settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="modal-head">
        <h2 id="settings-title">Settings</h2>
        <button type="button" id="settings-close" aria-label="Close settings">✕</button>
      </div>
      <div class="settings-layout">
        <nav class="settings-nav" id="settings-nav" aria-label="Settings categories"></nav>
        <div class="settings-content" id="settings-content"></div>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
