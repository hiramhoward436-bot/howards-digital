name = "hd"
main = "src/index.js"
compatibility_date = "2026-09-12"

[vars]
APP_NAME = "Howard's Digital"
APP_VERSION = "0.1.0"

[[d1_databases]]
binding = "HD_DB"
database_name = "howards-digital"
database_id = "4d3788c1-a07a-4c16-b092-1a6849b55d9e"
migrations_dir = "migrations"

# R2 bucket binding intentionally disabled: R2 requires a payment method on file
# and Hiram declined. File uploads are stored as blobs in D1 instead (free tier).
# [[r2_buckets]]
# binding = "HD_FILES"
# bucket_name = "howards-digital-files"

[assets]
directory = "./public"
